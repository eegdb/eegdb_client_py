[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eegdb-client"
version = "0.1.0"
description = "Python desktop, CLI, and notebook client for EEGDB"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "EEGDB Team" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "pyedflib>=0.1.38",
  "PyQt6>=6.6",
  "PyQt6-Fluent-Widgets>=1.11.0",
  "mne>=1.6",
  "curryreader>=0.1.0",
  "protobuf>=6.31.1,<7",
  "platformdirs>=4.0",
  "pyxdf>=1.16",
  "pylsl>=1.16",
]

[project.optional-dependencies]
arrow = ["pyarrow>=16"]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.8",
  "twine>=6",
]

[project.scripts]
eegdb-client = "eegdb_client.cli:main"

[project.gui-scripts]
eegdb-client-gui = "eegdb_client.ui.main_window:run_app"

[project.urls]
Repository = "https://github.com/eegdb/eegdb_client_py"

[tool.setuptools.packages.find]
include = ["eegdb_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["eegdb_client/protocol/v1/protocol_pb2.py"]

[tool.ruff.lint]
# Start with correctness checks so CI can gate real defects without forcing a
# repository-wide formatting rewrite. Style rules can be enabled incrementally.
select = ["E9", "F"]
